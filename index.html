alse},{"id":"1nb_CrN30yMuqERuHZhMN-U7opfM9rC8n","title":"03 - Bonus with Rotisserie 2","size":754581119,"seconds":1065,"poster":"thumbs/Intermediate-Advanced/03%20-%20Bonus%20with%20Rotisserie%202.jpg","fresh":false},{"id":"1PBjny9DPvO_WsfRTNxEPNj8W_Hw3_6b5","title":"04 - Viradinha with Swag","size":932730671,"seconds":1316,"poster":null,"fresh":false},{"id":"1Kbo5tvCS_OeudTMDYkEgZh296Abb0hG4","title":"05 - Ballon into rotisserie and chicote","size":609201350,"seconds":865,"poster":null,"fresh":false},{"id":"1YNDLVr3ZtX1TGkl59Rk2sd18mOFYDL6O","title":"06 - Tilted turns with chicote","size":929224632,"seconds":1307,"poster":null,"fresh":false},{"id":"1CkgrhDSIB0EqQMYHG-G96TXjFhOY8O_Y","title":"07 - Tilted turns into rotisserie 1","size":654881568,"seconds":925,"poster":null,"fresh":false},{"id":"1kB9vi4pdyKuwNP2ukkIag0nVapHysUIq","title":"08 - Tilted turns into rotisserie 2","size":873166785,"seconds":1229,"poster":null,"fresh":false},{"id":"1e1gmPys6kom3adEdt2LRyVrbryIJVGRz","title":"09 - Multiple turns into chicote","size":921192355,"seconds":1295,"poster":null,"fresh":false},{"id":"14iadIZYRu6NacXUDUmaEWYyqNuQiBwpv","title":"10 - Reverse lateral with rotisserie","size":537347681,"seconds":767,"poster":null,"fresh":false},{"id":"1u69oknZicX7lzrjKYAmvTFrQRmIkabhw","title":"11 - Syncopated rotisserie","size":532765759,"seconds":898,"poster":null,"fresh":false}],"bytes":7525354018,"seconds":10804,"fresh":0,"poster":"thumbs/Intermediate-Advanced/01%20-%20Intro.jpg"}]}];
  const LAST = 'dance_videos:last';
  const view = document.getElementById('view');
  const crumbs = document.getElementById('crumbs');
  const tools = document.getElementById('tools');
  const q = document.getElementById('q');
  const count = document.getElementById('count');

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const hms = (s) => (Math.floor(s / 3600) ? Math.floor(s / 3600) + ':' : '') +
    String(Math.floor((s % 3600) / 60)).padStart(2, '0') + ':' + String(Math.round(s % 60)).padStart(2, '0');
  const mb = (b) => (b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : (b / 1e6).toFixed(0) + ' MB');
  const crumb = (parts) => parts.map((p, i) => (p.href && i < parts.length - 1
      ? '<a href="' + p.href + '">' + esc(p.name) + '</a>'
      : '<span class="here">' + esc(p.name) + '</span>')
    + (i < parts.length - 1 ? ' <span class="sep">/</span> ' : '')).join('');

  const style = (s) => DATA.find((x) => x.slug === s);
  const courseOf = (st, c) => st && st.courses.find((x) => x.slug === c);

  function card(l) {
    return '<article class="card" data-id="' + l.id + '" data-name="' + esc(l.title.toLowerCase()) + '" data-title="' + esc(l.title) + '" data-size="' + mb(l.size) + '">' +
      '<div class="thumb">' +
        (l.poster ? '<img loading="lazy" alt="" src="' + esc(l.poster) + '">' : '<span class="ph">▶</span>') +
        '<span class="play" aria-hidden="true">▶</span>' +
        (l.fresh ? '<span class="badge warn">processing</span>' : (l.seconds ? '<span class="badge">' + hms(l.seconds) + '</span>' : '')) +
      '</div>' +
      '<div class="meta"><span class="t">' + esc(l.title) + '</span><span class="d">' + mb(l.size) + '</span></div>' +
    '</article>';
  }

  function home() {
    crumbs.innerHTML = crumb([{ name: 'dance_videos' }]);
    tools.classList.add('hidden');
    view.innerHTML = '<h1>Pick a dance</h1><p class="lede">Course archive, played straight from Google Drive.</p>' +
      '<div class="grid styles">' + DATA.map((s) => {
        const n = s.courses.reduce((a, c) => a + c.lessons.length, 0);
        const b = s.courses.reduce((a, c) => a + c.bytes, 0);
        const secs = s.courses.reduce((a, c) => a + c.seconds, 0);
        const poster = (s.courses.find((c) => c.poster) || {}).poster;
        return '<a class="card" href="#/' + s.slug + '"><div class="thumb">' +
          (poster ? '<img alt="" src="' + esc(poster) + '">' : '<span class="ph">' + esc(s.name[0]) + '</span>') +
          '<span class="play">▶</span></div><div class="meta"><span class="t">' + esc(s.name) + '</span>' +
          '<span class="d">' + s.courses.length + ' course' + (s.courses.length > 1 ? 's' : '') + ' · ' + n + ' lessons' +
          (secs ? ' · ' + Math.round(secs / 60) + ' min' : '') + ' · ' + mb(b) + '</span></div></a>';
      }).join('') + '</div>';
  }

  function styleView(st) {
    crumbs.innerHTML = crumb([{ name: 'dance_videos', href: '#/' }, { name: st.name }]);
    tools.classList.add('hidden');
    view.innerHTML = '<h1>' + esc(st.name) + '</h1><p class="lede">' + st.courses.length + ' courses</p>' +
      '<div class="grid">' + st.courses.map((c) => '<a class="card" href="#/' + st.slug + '/' + c.slug + '">' +
        '<div class="thumb">' + (c.poster ? '<img alt="" src="' + esc(c.poster) + '">' : '<span class="ph">▶</span>') +
        '<span class="play">▶</span><span class="badge">' + c.lessons.length + '</span></div>' +
        '<div class="meta"><span class="t">' + esc(c.name) + '</span><span class="d">' + c.lessons.length + ' lessons' +
        (c.seconds ? ' · ' + Math.round(c.seconds / 60) + ' min' : '') + ' · ' + mb(c.bytes) +
        (c.fresh ? ' · ' + c.fresh + ' processing' : '') + '</span></div></a>').join('') + '</div>';
  }

  function courseView(st, c) {
    crumbs.innerHTML = crumb([{ name: 'dance_videos', href: '#/' }, { name: st.name, href: '#/' + st.slug }, { name: c.name }]);
    tools.classList.remove('hidden');
    q.value = '';
    view.innerHTML = '<h1>' + esc(c.name) + '</h1><p class="lede">' + c.lessons.length + ' lessons · ' + mb(c.bytes) +
      (c.seconds ? ' · ' + Math.round(c.seconds / 60) + ' min' : '') + '</p><div class="grid">' +
      c.lessons.map(card).join('') + '</div><div class="empty hidden" id="empty">No lessons match that filter.</div>';
    wire(c.lessons);
  }

  function wire(list) {
    const cards = [...view.querySelectorAll('.card')];
    const empty = document.getElementById('empty');
    const refresh = () => {
      const n = cards.filter((c) => !c.classList.contains('hidden')).length;
      count.textContent = n === cards.length ? '' : n + ' of ' + cards.length;
      if (empty) empty.classList.toggle('hidden', n !== 0);
    };
    cards.forEach((el, i) => {
      el.tabIndex = 0;
      el.addEventListener('click', () => openPlayer({ list, index: i }));
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPlayer({ list, index: i }); } });
    });
    q.oninput = () => {
      const needle = q.value.trim().toLowerCase();
      for (const c of cards) c.classList.toggle('hidden', needle && !c.dataset.name.includes(needle));
      refresh();
    };
    refresh();
    try {
      const last = localStorage.getItem(LAST);
      const el = cards.find((c) => c.dataset.id === last);
      if (el) el.querySelector('.thumb')?.insertAdjacentHTML('beforeend', '<span class="badge" style="left:8px;right:auto">last played</span>');
    } catch {}
  }

  const player = document.getElementById('player');
  const state = { list: [], index: 0 };

  function openPlayer({ list, index }) {
    state.list = list;
    state.index = index;
    renderPlayer();
    player.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function renderPlayer() {
    const l = state.list[state.index];
    if (!l) return;
    player.innerHTML =
      '<div class="sheet">' +
        '<div class="hd">' +
          '<span class="t">' + esc(l.title) + '</span>' +
          '<span class="d">' + mb(l.size) + (l.seconds ? ' · ' + hms(l.seconds) : '') + '</span>' +
          '<span class="sp"></span>' +
          '<button class="reload" type="button" title="Reload player">↻</button>' +
          '<button class="fs" type="button" title="Fullscreen">⛶</button>' +
          '<a href="https://drive.google.com/file/d/' + l.id + '/view" target="_blank" rel="noopener">Watch in Drive ↗</a>' +
          '<button class="x" type="button" title="Close (Esc)">✕</button>' +
        '</div>' +
        '<div class="stage"><iframe src="https://drive.google.com/file/d/' + l.id + '/preview" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; storage-access" allowfullscreen></iframe></div>' +
        '<div class="ft">' +
          '<button class="prev" type="button"' + (state.index <= 0 ? ' disabled' : '') + '>← Previous</button>' +
          '<button class="next" type="button"' + (state.index >= state.list.length - 1 ? ' disabled' : '') + '>Next →</button>' +
          (l.fresh ? '<span class="note">Drive is still processing this upload — if it will not play yet, give it a few minutes and hit ↻</span>' : '') +
          '<span class="pos">' + (state.index + 1) + ' of ' + state.list.length + '</span>' +
        '</div>' +
      '</div>';
    player.querySelector('.x').onclick = closePlayer;
    player.querySelector('.prev').onclick = () => step(-1);
    player.querySelector('.next').onclick = () => step(1);
    player.querySelector('.reload').onclick = () => {
      const fr = player.querySelector('iframe');
      if (fr) fr.src = 'https://drive.google.com/file/d/' + l.id + '/preview?_r=' + Date.now();
    };
    player.querySelector('.fs').onclick = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else player.requestFullscreen?.();
    };
    if (!document.fullscreenEnabled) player.querySelector('.fs')?.remove();   // iPhone Safari
    if (window.matchMedia('(max-width: 820px)').matches) {
      player.querySelector('.ft')?.insertAdjacentHTML('beforeend',
        '<span class="note">Phone tip: rotate for a bigger picture. If Google asks to allow access, tap Allow — or use Watch in Drive.</span>');
    }
    try { localStorage.setItem(LAST, l.id); } catch {}
  }

  function step(delta) {
    const n = state.index + delta;
    if (n < 0 || n >= state.list.length) return;
    state.index = n;
    renderPlayer();
  }

  function closePlayer() {
    player.classList.add('hidden');
    player.innerHTML = '';
    document.body.style.overflow = '';
  }

  player.addEventListener('click', (e) => { if (e.target === player) closePlayer(); });

  function route() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    if (!parts.length) return home();
    const st = style(parts[0]);
    if (!st) return home();
    if (parts.length === 1) return styleView(st);
    const c = courseOf(st, parts[1]);
    if (!c) return styleView(st);
    return courseView(st, c);
  }

  document.addEventListener('keydown', (e) => {
    const modalOpen = !player.classList.contains('hidden');
    if (e.key === '/' && !modalOpen && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape') {
      if (modalOpen) return closePlayer();
      if (q.value) { q.value = ''; q.oninput && q.oninput(); }
    }
    if (modalOpen && e.key === 'ArrowLeft') step(-1);
    if (modalOpen && e.key === 'ArrowRight') step(1);
  });
  // entry gate: cookie remembers the unlock for 30 days
  const PASS_HASH = 'f1e9592a';
  const fnv1a8 = (s) => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };
  document.getElementById('gateForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('gatePass');
    if (fnv1a8('dance_videos:' + input.value) === PASS_HASH) {
      const secure = location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = 'dv_pass=' + PASS_HASH + '; Max-Age=2592000; Path=/; SameSite=Lax' + secure;
      document.documentElement.classList.remove('locked');
      input.value = '';
    } else {
      document.getElementById('gateErr').textContent = 'Wrong password.';
      input.select();
    }
  });
  if (document.documentElement.classList.contains('locked')) setTimeout(() => document.getElementById('gatePass').focus(), 60);

  window.addEventListener('hashchange', route);
  route();
</script>
