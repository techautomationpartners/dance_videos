<style>
  :root { color-scheme: dark; --bg:#0b0d12; --panel:#14171f; --panel2:#1a1e27; --line:#242a36;
          --fg:#e8eaf0; --dim:#98a2b3; --accent:#6ee7b7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: radial-gradient(1200px 600px at 50% -240px, #17222e, var(--bg)) fixed, var(--bg);
         color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: 0 clamp(14px, 4vw, 44px) 72px; }
  header { position: sticky; top: 0; z-index: 10; margin: 0 calc(-1 * clamp(14px, 4vw, 44px)) 10px;
           padding: 18px clamp(14px, 4vw, 44px) 14px; background: rgba(11,13,18,.84);
           backdrop-filter: saturate(140%) blur(12px); border-bottom: 1px solid var(--line); }
  a { color: inherit; }
  .brand { display: inline-flex; align-items: baseline; gap: 10px; text-decoration: none; }
  .brand b { font-size: clamp(17px, 2.3vw, 22px); font-weight: 650; letter-spacing: -.01em; }
  .brand span { color: var(--dim); font-size: 13px; }
  nav { margin-top: 8px; color: var(--dim); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  nav a { color: var(--dim); text-decoration: none; }
  nav a:hover { color: var(--fg); }
  nav .sep { color: #3d4453; }
  nav .here { color: var(--fg); }
  .tools { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  input[type=search] { flex: 1 1 240px; max-width: 420px; padding: 10px 13px; border-radius: 10px;
           border: 1px solid var(--line); background: var(--panel); color: inherit; font: inherit; }
  input[type=search]:focus { outline: 2px solid #2f4a5f; outline-offset: 1px; }
  .count { color: var(--dim); font-size: 13px; }
  h1 { font-size: clamp(20px, 3vw, 28px); margin: 22px 0 6px; font-weight: 650; letter-spacing: -.015em; }
  .lede { color: var(--dim); margin: 0 0 22px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #cbd5e1; margin: 30px 0 14px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); }
  .grid.styles { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer;
          transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease; text-decoration: none; display: block; }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: #39415470; box-shadow: 0 12px 34px -14px #000; }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: linear-gradient(135deg, #1b2431, #0d1117); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .94; }
  .thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #4b5566; font-size: 26px; font-weight: 600; }
  .play { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; color: #fff; opacity: 0;
          background: linear-gradient(180deg, #0000, #000a); transition: opacity .16s ease; }
  .card:hover .play { opacity: 1; }
  .badge { position: absolute; right: 8px; bottom: 8px; padding: 2px 7px; border-radius: 6px; font-size: 11px;
           background: #000000b8; color: #e5e7eb; font-variant-numeric: tabular-nums; }
  .badge.warn { background: #7c2d12d9; color: #fed7aa; }
  #player .ft .note { color: #fbbf24; font-size: 12px; }
  .meta { display: flex; flex-direction: column; gap: 2px; padding: 11px 13px 13px; min-width: 0; }
  .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .d { color: var(--dim); font-size: 12px; }
  .card.playing { cursor: default; transform: none; box-shadow: none; }
  .card.playing .frame { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .card.playing iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 13px;
         border-top: 1px solid var(--line); background: var(--panel2); }
  .bar a, .bar button { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
  .bar .x { color: var(--dim); }
  .empty { color: var(--dim); padding: 36px 0; }
  .hidden { display: none !important; }
  /* full-screen player */
  #player { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
            background: #05070ae6; backdrop-filter: blur(6px); padding: clamp(8px, 3vw, 40px); }

  #player .hd .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #player .hd .d { color: var(--dim); font-size: 12px; white-space: nowrap; }
  #player .hd .sp { flex: 1; }
  #player .hd a, #player .hd button { font: inherit; font-size: 13px; background: none; border: 0; cursor: pointer; color: var(--accent); padding: 4px 6px; }
  #player .hd .x { color: var(--dim); font-size: 16px; }
  #player .stage { position: relative; aspect-ratio: 16 / 9; background: #000; }
  #player .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #player .ft { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel2); }
  #player .ft button { font: inherit; font-size: 13px; background: var(--panel); color: var(--fg); border: 1px solid var(--line);
            border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  #player .ft button:disabled { opacity: .4; cursor: default; }
  #player .ft .pos { color: var(--dim); font-size: 12px; margin-left: auto; }
  #player:fullscreen .sheet { width: 100vw; max-width: none; border-radius: 0; border: 0; }
  footer { color: #566072; font-size: 12px; margin-top: 48px; border-top: 1px solid var(--line); padding-top: 16px; }
  @media (max-width: 520px) { .grid, .grid.styles { grid-template-columns: 1fr; } }
  /* phone / tablet: bigger touch targets, safe areas, no zoom-on-focus */
  #player .hd button, #player .hd a, #player .ft button { min-height: 40px; min-width: 40px;
           display: inline-flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .card { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .card:active { transform: scale(.99); }
  @media (max-width: 820px) {
    body { padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
    h1 { font-size: 21px; }
    input[type=search], #gate input { font-size: 16px; }   /* iOS zooms on < 16px */
    #gate button { padding: 13px; }
    .grid { gap: 14px; }
    .card .t { font-size: 15px; }
    #player { padding: 0; }
    #player .sheet { width: 100vw; max-width: none; border: 0; border-radius: 0; max-height: 100dvh; overflow: auto; }
    #player .hd { flex-wrap: wrap; gap: 8px; }
    #player .ft { flex-wrap: wrap; }
    #player .ft button { flex: 1 1 auto; padding: 11px 14px; }
    #player .pos { margin-left: 0; width: 100%; }
  }
  @media (max-width: 820px) and (orientation: landscape) {
    #player .stage { max-height: 62dvh; }
  }
  /* entry gate */
  #gate { display: none; }
  html.locked #gate { display: grid; }
  html.locked header, html.locked main, html.locked footer { display: none; }
  html.locked body { overflow: hidden; }
  #gate { position: fixed; inset: 0; z-index: 100; place-items: center; background: var(--bg); padding: 20px; }
  #gate .box { width: min(380px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 26px 24px; }
  #gate h2 { margin: 0 0 6px; text-transform: none; letter-spacing: 0; font-size: 18px; color: var(--fg); }
  #gate p { margin: 0 0 18px; color: var(--dim); font-size: 13px; }
  #gate input { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: #0f1218; color: inherit; font: inherit; }
  #gate button { margin-top: 12px; width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid #2f6f5a;
           background: #17402f; color: #d1fae5; font: inherit; font-weight: 600; cursor: pointer; }
  #gate button:hover { background: #1c4c38; }
  #gate .err { color: #fca5a5; font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>

    };
    cards.forEach((el, i) => {
      el.tabIndex = 0;
      el.addEventListener('click', () => openPlayer({ list, index: i }));
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPlayer({ list, index: i }); } });
    });
    q.oninput = () => {
      const needle = q.value.trim().toLowerCase();
      for (const c of cards) c.classList.toggle('hidden', needle && !c.dataset.name.includes(needle));
      refresh();
    };
    refresh();
    try {
      const last = localStorage.getItem(LAST);
      const el = cards.find((c) => c.dataset.id === last);
      if (el) el.querySelector('.thumb')?.insertAdjacentHTML('beforeend', '<span class="badge" style="left:8px;right:auto">last played</span>');
    } catch {}
  }

  const player = document.getElementById('player');
  const state = { list: [], index: 0 };

  function openPlayer({ list, index }) {
    state.list = list;
    state.index = index;
    renderPlayer();
    player.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function renderPlayer() {
    const l = state.list[state.index];
    if (!l) return;
    player.innerHTML =
      '<div class="sheet">' +
        '<div class="hd">' +
          '<span class="t">' + esc(l.title) + '</span>' +
          '<span class="d">' + mb(l.size) + (l.seconds ? ' · ' + hms(l.seconds) : '') + '</span>' +
          '<span class="sp"></span>' +
          '<button class="reload" type="button" title="Reload player">↻</button>' +
          '<button class="fs" type="button" title="Fullscreen">⛶</button>' +
          '<a href="https://drive.google.com/file/d/' + l.id + '/view" target="_blank" rel="noopener">Watch in Drive ↗</a>' +
          '<button class="x" type="button" title="Close (Esc)">✕</button>' +
        '</div>' +
        '<div class="stage"><iframe src="https://drive.google.com/file/d/' + l.id + '/preview" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; storage-access" allowfullscreen></iframe></div>' +
        '<div class="ft">' +
          '<button class="prev" type="button"' + (state.index <= 0 ? ' disabled' : '') + '>← Previous</button>' +
          '<button class="next" type="button"' + (state.index >= state.list.length - 1 ? ' disabled' : '') + '>Next →</button>' +
          (l.fresh ? '<span class="note">Drive is still processing this upload — if it will not play yet, give it a few minutes and hit ↻</span>' : '') +
          '<span class="pos">' + (state.index + 1) + ' of ' + state.list.length + '</span>' +
        '</div>' +
      '</div>';
    player.querySelector('.x').onclick = closePlayer;
    player.querySelector('.prev').onclick = () => step(-1);
    player.querySelector('.next').onclick = () => step(1);
    player.querySelector('.reload').onclick = () => {
      const fr = player.querySelector('iframe');
      if (fr) fr.src = 'https://drive.google.com/file/d/' + l.id + '/preview?_r=' + Date.now();
    };
    player.querySelector('.fs').onclick = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else player.requestFullscreen?.();
    };
    if (!document.fullscreenEnabled) player.querySelector('.fs')?.remove();   // iPhone Safari
    if (window.matchMedia('(max-width: 820px)').matches) {
      player.querySelector('.ft')?.insertAdjacentHTML('beforeend',
        '<span class="note">Phone tip: rotate for a bigger picture. If Google asks to allow access, tap Allow — or use Watch in Drive.</span>');
    }
    try { localStorage.setItem(LAST, l.id); } catch {}
  }

  function step(delta) {
    const n = state.index + delta;
    if (n < 0 || n >= state.list.length) return;
    state.index = n;
    renderPlayer();
  }

  function closePlayer() {
    player.classList.add('hidden');
    player.innerHTML = '';
    document.body.style.overflow = '';
  }

  player.addEventListener('click', (e) => { if (e.target === player) closePlayer(); });

  function route() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    if (!parts.length) return home();
    const st = style(parts[0]);
    if (!st) return home();
    if (parts.length === 1) return styleView(st);
    const c = courseOf(st, parts[1]);
    if (!c) return styleView(st);
    return courseView(st, c);
  }

  document.addEventListener('keydown', (e) => {
    const modalOpen = !player.classList.contains('hidden');
    if (e.key === '/' && !modalOpen && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape') {
      if (modalOpen) return closePlayer();
      if (q.value) { q.value = ''; q.oninput && q.oninput(); }
    }
    if (modalOpen && e.key === 'ArrowLeft') step(-1);
    if (modalOpen && e.key === 'ArrowRight') step(1);
  });
  // entry gate: cookie remembers the unlock for 30 days
  const PASS_HASH = 'f1e9592a';
  const fnv1a8 = (s) => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };
  document.getElementById('gateForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('gatePass');
    if (fnv1a8('dance_videos:' + input.value) === PASS_HASH) {
      const secure = location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = 'dv_pass=' + PASS_HASH + '; Max-Age=2592000; Path=/; SameSite=Lax' + secure;
      document.documentElement.classList.remove('locked');
      input.value = '';
    } else {
      document.getElementById('gateErr').textContent = 'Wrong password.';
      input.select();
    }
  });
  if (document.documentElement.classList.contains('locked')) setTimeout(() => document.getElementById('gatePass').focus(), 60);

  window.addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
